# The monitoring stack as it runs on the server (/home/vps-monitoring), deployed by
# .github/workflows/deploy.yml.
#
# Every port is bound to 127.0.0.1: reachable from the server itself or through an SSH tunnel
# (ssh -L 3000:127.0.0.1:3000 user@server), never from the internet. Docker's published ports go
# around the host firewall (ufw), so a port without "127.0.0.1:" is public whatever ufw says.
# CI (scripts/check-ports.sh) refuses a port that is not bound to 127.0.0.1.
#
# The services talk to each other over monitor-net (prometheus -> cadvisor:8080,
# promtail -> loki:3100, grafana -> prometheus:9090 and loki:3100). Prometheus is also on
# traefik-net, to scrape the apps there (predictor_api_prod:8000).
#
# Images are pinned to the versions running on the server, so a deploy never upgrades by surprise.
# Upgrade one by changing its tag here.
#
# Grafana (jarllindquist.com/grafana/) and Prometheus (jarllindquist.com/prometheus/) are also
# reached through Traefik, behind the magic-link login: the middleware ops-auth@docker from
# auth-gateway asks for a valid login before every request. Paths, not subdomains, so no DNS
# records are needed.

services:
  prometheus:
    image: prom/prometheus:v2.53.4
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # Links in the UI point at /prometheus/, but Prometheus itself still answers on / (Traefik
      # strips the prefix), so Grafana's data source http://prometheus:9090 keeps working
      - "--web.external-url=https://jarllindquist.com/prometheus/"
      - "--web.route-prefix=/"
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - monitor-net
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.prometheus.rule=Host(`jarllindquist.com`) && PathPrefix(`/prometheus`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.tls.certresolver=myresolver"
      - "traefik.http.routers.prometheus.middlewares=ops-auth@docker,prometheus-strip"
      - "traefik.http.middlewares.prometheus-strip.stripprefix.prefixes=/prometheus"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
    restart: always

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      - monitor-net
    restart: always

  # Behind the login, Grafana trusts the user name auth-gateway puts in X-WEBAUTH-USER (Traefik
  # replaces any such header from the browser), so you land logged in as admin. It trusts that header
  # only from grafana-proxy: an internal network with Traefik and Grafana alone. Traefik's compose
  # file defines it (internal, 10.250.42.0/29), so it exists whenever Traefik runs. The other apps on
  # traefik-net can't reach Grafana at all, so none of them can send the header itself.
  # The admin password still works through the tunnel: ssh -L 3000:127.0.0.1:3000 user@server, then
  # http://localhost:3000/grafana/
  grafana:
    image: grafana/grafana:12.3.1
    container_name: grafana
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SERVER_ROOT_URL=https://jarllindquist.com/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_AUTH_PROXY_ENABLED=true
      - GF_AUTH_PROXY_HEADER_NAME=X-WEBAUTH-USER
      - GF_AUTH_PROXY_HEADER_PROPERTY=username
      # Only existing users: a name Grafana doesn't know gets an error, not a new account
      - GF_AUTH_PROXY_AUTO_SIGN_UP=false
      - GF_AUTH_PROXY_WHITELIST=10.250.42.0/29
    networks:
      - monitor-net
      - grafana-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=grafana-proxy"
      - "traefik.http.routers.grafana.rule=Host(`jarllindquist.com`) && PathPrefix(`/grafana`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=myresolver"
      - "traefik.http.routers.grafana.middlewares=ops-auth@docker"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    restart: always

  # Loki stores the logs Promtail collects; Grafana reads them. Its API has no login, so it must
  # never be public (anyone could read every container's logs, or push fake ones).
  loki:
    image: grafana/loki:3.7.8
    container_name: loki
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitor-net
    restart: always

  # Promtail tails every container's log file and sends the lines to Loki.
  promtail:
    image: grafana/promtail:3.6.8
    container_name: promtail
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail-config.yaml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitor-net
    restart: always

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitor-net:
    driver: bridge
  traefik-net:
    external: true
  grafana-proxy:
    external: true
